# =============================================================================
# Nginx Initial Bootstrap Configuration (HTTP Only)
# Target OS: Amazon Linux 2023 (/etc/nginx/conf.d/ember-ash.conf)
# Use this configuration BEFORE SSL certificate issuance.
# It enables Certbot webroot ACME verification while proxying backend API traffic.
# =============================================================================

upstream ember_ash_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _; # Catch-all: accepts requests via EC2 Public IP, Public DNS, or custom domain

    # Let's Encrypt ACME challenge path for Certbot HTTP-01 verification
    # Certbot writes to /var/www/certbot/.well-known/acme-challenge/<token>
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Request limits
    client_max_body_size 1m;
    client_body_buffer_size 128k;

    # Timeouts
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # Logging
    access_log /var/log/nginx/ember_ash_access.log;
    error_log /var/log/nginx/ember_ash_error.log warn;

    # Health Check endpoint
    location /health {
        proxy_pass http://ember_ash_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Protect rate limiting from spoofing: pass authentic TCP remote address
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Routes proxying to Express backend on 127.0.0.1:5000
    location /api/ {
        proxy_pass http://ember_ash_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # Protect rate limiting from spoofing: pass authentic TCP remote address
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Root route
    location / {
        proxy_pass http://ember_ash_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
